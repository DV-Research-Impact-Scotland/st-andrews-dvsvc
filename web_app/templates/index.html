<head><link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
<a href="{{ url_for('map_view', location=loc, distance=dist)}}"><button>Map View</button></a>
<h1> Enter Location</h1>
<form method="post", action="{{url_for('location_filter')}}">
       Postcode:
       <!--Postcode regex from Gov.UK @ https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/488478/Bulk_Data_Transfer_-_additional_validation_valid_from_12_November_2015.pdf-->
       <!-- Used to prevent injection attacks in this search-->
       <input required type="search" name="loc"
               placeholder={{loc}}
               value="{{ request.form['loc'] }}"
               pattern="^([Gg][Ii][Rr] 0[Aa]{2})|((([A-Za-z][0-9]{1,2})|(([A-Za-z][A-Ha-hJ-Yj-y][0-9]{1,2})|(([AZa-z][0-9][A-Za-z])|([A-Za-z][A-Ha-hJ-Yj-y][0-9]?[A-Za-z])))) [0-9][A-Za-z]{2})$"></input>
       <br>
       <br>
       distance:
        <input required type="number" name="dist"
               placeholder={{dist}}
               value="{{ request.form['dist'] }}"
               min = 0 
               max = 1000></input>
       km
       <br>
       <br>
        <button type="submit" >Submit</button>
</form>
<!--Appends results to page, only if there is results. |safe, marks the result string as safe (string built in app.py)-->
{% if result%}
  <div>{{result|safe}}</div>
{% endif %}

</body>
